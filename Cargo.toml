[workspace]
resolver = "2"
members = [
    "crates/rustmic-core",
    "crates/rustmic-transport",
    "crates/rustmic-app",
    "crates/rustmic-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-only"
repository = "https://github.com/sambukuper/rustmic"

[workspace.dependencies]
rustmic-core = { path = "crates/rustmic-core" }
rustmic-transport = { path = "crates/rustmic-transport" }
rustmic-app = { path = "crates/rustmic-app" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
