[package]
name = "womic-gui"
description = "Desktop client with a window, in the spirit of the original WO Mic client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "womic-gui"
path = "src/main.rs"

[dependencies]
womic-core = { workspace = true }
womic-transport = { workspace = true }
womic-app = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
