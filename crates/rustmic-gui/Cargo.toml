[package]
name = "rustmic-gui"
description = "Desktop client with a window, in the spirit of the original WO Mic client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustmic-gui"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
rustmic-core = { workspace = true }
rustmic-transport = { workspace = true }
rustmic-app = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
